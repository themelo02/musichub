<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f18"/>
      <stop offset="100%" stop-color="#05080e"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="35%" stop-color="#8b5cf6"/>
      <stop offset="70%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#glowGrad)" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Equalizer Audio Spectrum Bars in Center -->
  <g transform="translate(66, 120)">
    <!-- Bar 1 -->
    <rect x="20" y="150" width="32" height="110" rx="16" fill="url(#accentGrad)"/>
    <!-- Bar 2 -->
    <rect x="70" y="90" width="32" height="170" rx="16" fill="url(#accentGrad)"/>
    <!-- Bar 3 -->
    <rect x="120" y="40" width="32" height="220" rx="16" fill="url(#accentGrad)"/>
    <!-- Bar 4 (Peak) -->
    <rect x="170" y="10" width="32" height="250" rx="16" fill="url(#accentGrad)"/>
    <!-- Bar 5 -->
    <rect x="220" y="60" width="32" height="200" rx="16" fill="url(#accentGrad)"/>
    <!-- Bar 6 -->
    <rect x="270" y="110" width="32" height="150" rx="16" fill="url(#accentGrad)"/>
    <!-- Bar 7 -->
    <rect x="320" y="160" width="32" height="100" rx="16" fill="url(#accentGrad)"/>
  </g>

  <!-- Studio Hub Monogram Badge -->
  <g transform="translate(256, 420)">
    <rect x="-140" y="-36" width="280" height="48" rx="24" fill="#0f172a" stroke="#84cc16" stroke-width="2"/>
    <text text-anchor="middle" y="-4" fill="#84cc16" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="3">
      STUDIO HUB
    </text>
  </g>
</svg>
